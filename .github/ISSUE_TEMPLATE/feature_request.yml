name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的不便或缺口，而不是直接给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响面
      description: 涉及数据/迁移/界面/依赖/开源维护的哪些部分？
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue 与文档
          required: true
