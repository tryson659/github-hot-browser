name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴真实 GitHub Token、数据库内容或其他凭证。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用版本（见 app/__init__.py）或 exe 版本
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本、Python 版本、PySide6 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图（已脱敏）
      description: crash_logs 与状态栏信息；请先移除 Token、用户名与真实数据。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已确认不是重复 Issue
          required: true
        - label: 已移除凭证与真实用户数据
          required: true
